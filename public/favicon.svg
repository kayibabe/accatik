<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">MatchSlip</title>

  <!-- Solid rounded square: the slip/ticket, kept filled so it holds at 16-32px. -->
  <rect width="64" height="64" rx="16" fill="#047857" />

  <!-- White slip glyph (fold dropped for the favicon)... -->
  <rect x="14" y="10" width="36" height="44" rx="6" fill="#ffffff" />

  <!-- ...with an emerald check knocked out of it: the evidence-backed pick. -->
  <path
    d="M23.5 33.5 L30 40 L42.5 25"
    fill="none"
    stroke="#047857"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
